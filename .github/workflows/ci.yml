name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Run unit tests
        run: npm test

  node-version-cache-keys:
    name: Node version cache keys (ubuntu-latest)
    needs: unit
    runs-on: ubuntu-latest
    env:
      PINNED_SUFFIX: node-keys-pinned-${{ github.run_id }}-${{ github.run_attempt }}
      FLOATING_SUFFIX: node-keys-floating-${{ github.run_id }}-${{ github.run_attempt }}
      FIXTURE: fixtures/npm-basic
    steps:
      - uses: actions/checkout@v6

      # A restored node_modules can contain native addons compiled against the
      # NODE_MODULE_VERSION of the major that installed them, so the cache key
      # has to separate majors and only majors.
      - name: Prime the cache on Node 24
        id: prime-24
        uses: ./
        with:
          node-version: 24.14.1
          working-directory: ${{ env.FIXTURE }}
          cache-key-suffix: ${{ env.PINNED_SUFFIX }}

      - name: Remove materialized dependencies
        run: rm -rf "${FIXTURE}/node_modules"

      - name: Restore on a different patch of the same major
        id: restore-24x
        uses: ./
        with:
          node-version: 24.x
          working-directory: ${{ env.FIXTURE }}
          cache-key-suffix: ${{ env.PINNED_SUFFIX }}

      # The tree was installed under 24.14.1 and restored under 24.x. Actually
      # importing it is what proves the shared entry is usable, not just present.
      - name: Validate the dependency restored across patch versions
        working-directory: ${{ env.FIXTURE }}
        run: node check.mjs

      - name: Remove materialized dependencies
        run: rm -rf "${FIXTURE}/node_modules"

      - name: Miss on a different major
        id: miss-22x
        uses: ./
        with:
          node-version: 22.x
          working-directory: ${{ env.FIXTURE }}
          cache-key-suffix: ${{ env.PINNED_SUFFIX }}

      - name: Validate pinned-spec cache separation
        uses: actions/github-script@v8
        env:
          PRIME_24_HIT: ${{ steps.prime-24.outputs.cache-hit }}
          PRIME_24_MAJOR: ${{ steps.prime-24.outputs.node-major }}
          RESTORE_24X_HIT: ${{ steps.restore-24x.outputs.cache-hit }}
          RESTORE_24X_MAJOR: ${{ steps.restore-24x.outputs.node-major }}
          MISS_22X_HIT: ${{ steps.miss-22x.outputs.cache-hit }}
          MISS_22X_MAJOR: ${{ steps.miss-22x.outputs.node-major }}
        with:
          script: |
            const assert = require('assert/strict');
            assert.notEqual(process.env.PRIME_24_HIT, 'true');
            assert.equal(process.env.PRIME_24_MAJOR, '24');
            assert.equal(
              process.env.RESTORE_24X_HIT,
              'true',
              '24.x and 24.14.1 share an ABI and must share a cache entry',
            );
            assert.equal(process.env.RESTORE_24X_MAJOR, '24');
            assert.notEqual(
              process.env.MISS_22X_HIT,
              'true',
              '22.x must not restore a tree installed under Node 24',
            );
            assert.equal(process.env.MISS_22X_MAJOR, '22');

      - name: Remove materialized dependencies
        run: rm -rf "${FIXTURE}/node_modules"

      # lts/* cannot be classified from the string, so the action resolves it
      # with setup-node before computing the key.
      - name: Prime the cache on a floating spec
        id: prime-floating
        uses: ./
        with:
          node-version: lts/*
          working-directory: ${{ env.FIXTURE }}
          cache-key-suffix: ${{ env.FLOATING_SUFFIX }}

      - name: Validate the floating spec resolved to the installed major
        env:
          NODE_MAJOR: ${{ steps.prime-floating.outputs.node-major }}
          CACHE_HIT: ${{ steps.prime-floating.outputs.cache-hit }}
          SETUP_NODE_DURATION_MS: ${{ steps.prime-floating.outputs.setup-node-duration-ms }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            assert.notEqual(process.env.CACHE_HIT, "true");
            assert.equal(
              process.versions.node.split(".")[0],
              process.env.NODE_MAJOR,
              "the cache key major must match the Node.js actions/setup-node put on PATH",
            );
            assert.ok(
              Number.parseInt(process.env.SETUP_NODE_DURATION_MS, 10) > 0,
              "the pre-restore setup-node phase must still be timed",
            );
          '

      - name: Remove materialized dependencies
        run: rm -rf "${FIXTURE}/node_modules"

      - name: Restore the floating spec
        id: restore-floating
        uses: ./
        with:
          node-version: lts/*
          working-directory: ${{ env.FIXTURE }}
          cache-key-suffix: ${{ env.FLOATING_SUFFIX }}

      - name: Validate the floating restore
        uses: actions/github-script@v8
        env:
          CACHE_HIT: ${{ steps.restore-floating.outputs.cache-hit }}
          NODE_MAJOR: ${{ steps.restore-floating.outputs.node-major }}
          PRIMED_NODE_MAJOR: ${{ steps.prime-floating.outputs.node-major }}
        with:
          script: |
            const assert = require('assert/strict');
            assert.equal(process.env.CACHE_HIT, 'true');
            assert.equal(process.env.NODE_MAJOR, process.env.PRIMED_NODE_MAJOR);

      - name: Validate restored dependency
        working-directory: ${{ env.FIXTURE }}
        run: node check.mjs

  electron-cache:
    name: Electron lifecycle cache (${{ matrix.os }})
    needs: unit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      FIXTURE: fixtures/pnpm-basic
      CACHE_SUFFIX: electron-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Prime the default dependency cache
        id: default-prime
        uses: ./
        with:
          node-version: 24.14.1
          working-directory: ${{ env.FIXTURE }}
          cache-key-suffix: ${{ env.CACHE_SUFFIX }}

      - name: Remove default-mode dependencies
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            fs.rmSync(
              path.join(process.env.GITHUB_WORKSPACE, process.env.FIXTURE, 'node_modules'),
              { recursive: true, force: true },
            );
            fs.rmSync(
              path.join(process.env.GITHUB_WORKSPACE, process.env.FIXTURE, '.pnpm-store'),
              { recursive: true, force: true },
            );

      - name: Prime the Electron cache through lookup-only
        id: electron-prime
        uses: ./
        with:
          node-version: 24.14.1
          working-directory: ${{ env.FIXTURE }}
          cache-electron: "true"
          cache-key-suffix: ${{ env.CACHE_SUFFIX }}
          lookup-only: "true"

      - name: Validate key separation and lifecycle writes
        uses: actions/github-script@v8
        env:
          DEFAULT_HIT: ${{ steps.default-prime.outputs.cache-hit }}
          ELECTRON_HIT: ${{ steps.electron-prime.outputs.cache-hit }}
        with:
          script: |
            const assert = require('assert/strict');
            const fs = require('fs');
            const path = require('path');
            const fixture = path.join(process.env.GITHUB_WORKSPACE, process.env.FIXTURE);
            assert.notEqual(process.env.DEFAULT_HIT, 'true');
            assert.notEqual(
              process.env.ELECTRON_HIT,
              'true',
              'cache-electron must not hit the default-mode immutable cache',
            );
            assert.equal(
              process.env.npm_config_cache,
              path.join(fixture, '.cache', 'configure-nodejs', 'npm'),
            );
            assert.equal(
              process.env.electron_config_cache,
              path.join(fixture, '.cache', 'configure-nodejs', 'electron'),
            );
            assert.ok(
              fs.existsSync(path.join(process.env.npm_config_cache, '_prebuilds', 'native-abi.marker')),
            );
            assert.ok(
              fs.existsSync(path.join(process.env.electron_config_cache, 'electron-runtime.marker')),
            );

      - name: Remove materialized cache content
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const fixture = path.join(process.env.GITHUB_WORKSPACE, process.env.FIXTURE);
            fs.rmSync(path.join(fixture, 'node_modules'), {
              recursive: true,
              force: true,
            });
            fs.rmSync(path.join(fixture, '.cache'), {
              recursive: true,
              force: true,
            });
            fs.rmSync(path.join(fixture, '.pnpm-store'), {
              recursive: true,
              force: true,
            });

      - name: Probe the primed Electron cache without restoring
        id: electron-probe
        uses: ./
        with:
          node-version: 24.14.1
          working-directory: ${{ env.FIXTURE }}
          cache-electron: "true"
          cache-key-suffix: ${{ env.CACHE_SUFFIX }}
          lookup-only: "true"

      - name: Validate lookup-only hit behavior
        uses: actions/github-script@v8
        env:
          CACHE_HIT: ${{ steps.electron-probe.outputs.cache-hit }}
        with:
          script: |
            const assert = require('assert/strict');
            const fs = require('fs');
            const path = require('path');
            const fixture = path.join(process.env.GITHUB_WORKSPACE, process.env.FIXTURE);
            assert.equal(process.env.CACHE_HIT, 'true');
            assert.equal(fs.existsSync(path.join(fixture, 'node_modules')), false);
            assert.equal(fs.existsSync(path.join(fixture, '.cache')), false);

      - name: Restore the Electron cache as a consumer
        id: electron-restore
        uses: ./
        with:
          node-version: 24.14.1
          working-directory: ${{ env.FIXTURE }}
          cache-electron: "true"
          cache-key-suffix: ${{ env.CACHE_SUFFIX }}

      - name: Validate both lifecycle caches restored before install
        uses: actions/github-script@v8
        env:
          CACHE_HIT: ${{ steps.electron-restore.outputs.cache-hit }}
        with:
          script: |
            const assert = require('assert/strict');
            const fs = require('fs');
            const path = require('path');
            assert.equal(process.env.CACHE_HIT, 'true');
            assert.ok(
              fs.existsSync(path.join(process.env.npm_config_cache, '_prebuilds', 'native-abi.marker')),
            );
            assert.ok(
              fs.existsSync(path.join(process.env.electron_config_cache, 'electron-runtime.marker')),
            );

  fixture:
    name: Fixture (${{ matrix.os }}, ${{ matrix.package-manager }})
    needs: unit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        package-manager:
          - npm
          - pnpm
          - yarn
    steps:
      - uses: actions/checkout@v6

      - name: Prime dependency cache
        id: prime
        uses: ./
        with:
          node-version: 24.14.1
          working-directory: fixtures/${{ matrix.package-manager }}-basic
          cache-key-suffix: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}

      - name: Validate primed install and outputs
        uses: actions/github-script@v8
        env:
          EXPECTED_PACKAGE_MANAGER: ${{ matrix.package-manager }}
          EXPECTED_WORKING_DIRECTORY: fixtures/${{ matrix.package-manager }}-basic
          ACTUAL_PACKAGE_MANAGER: ${{ steps.prime.outputs.package-manager }}
          ACTUAL_WORKING_DIRECTORY: ${{ steps.prime.outputs.working-directory }}
          ACTUAL_CACHE_HIT: ${{ steps.prime.outputs.cache-hit }}
          ACTUAL_PNPM_STORE_PATH: ${{ steps.prime.outputs.pnpm-store-path }}
          CACHE_RESTORE_DURATION_MS: ${{ steps.prime.outputs.cache-restore-duration-ms }}
          SETUP_NODE_DURATION_MS: ${{ steps.prime.outputs.setup-node-duration-ms }}
          ACTIVATION_DURATION_MS: ${{ steps.prime.outputs.package-manager-activation-duration-ms }}
          STORE_DISCOVERY_DURATION_MS: ${{ steps.prime.outputs.store-discovery-duration-ms }}
          INSTALL_DURATION_MS: ${{ steps.prime.outputs.install-duration-ms }}
          CACHE_SAVE_DURATION_MS: ${{ steps.prime.outputs.cache-save-duration-ms }}
          TOTAL_DURATION_MS: ${{ steps.prime.outputs.total-duration-ms }}
        with:
          script: |
            const assert = require('assert/strict');
            const path = require('path');
            assert.equal(
              process.env.ACTUAL_PACKAGE_MANAGER,
              process.env.EXPECTED_PACKAGE_MANAGER,
            );
            assert.equal(
              process.env.ACTUAL_WORKING_DIRECTORY,
              process.env.EXPECTED_WORKING_DIRECTORY,
            );
            assert.notEqual(process.env.ACTUAL_CACHE_HIT, 'true');
            if (process.env.EXPECTED_PACKAGE_MANAGER === 'pnpm') {
              const expectedStoreRoot = path.join(
                process.env.GITHUB_WORKSPACE,
                process.env.EXPECTED_WORKING_DIRECTORY,
                '.pnpm-store',
              );
              const normalizeForComparison = (value) => {
                const normalized = path.resolve(value);
                return process.platform === 'win32'
                  ? normalized.toLowerCase()
                  : normalized;
              };
              const relativeStorePath = path.relative(
                normalizeForComparison(expectedStoreRoot),
                normalizeForComparison(process.env.ACTUAL_PNPM_STORE_PATH),
              );
              assert.ok(
                relativeStorePath !== '..' &&
                  !relativeStorePath.startsWith(`..${path.sep}`) &&
                  !path.isAbsolute(relativeStorePath),
              );
              assert.equal(
                normalizeForComparison(process.env.npm_config_store_dir),
                normalizeForComparison(expectedStoreRoot),
              );
            }
            core.notice(
              `prime timings (ms): ${JSON.stringify({
                cacheRestore: process.env.CACHE_RESTORE_DURATION_MS,
                setupNode: process.env.SETUP_NODE_DURATION_MS,
                activation: process.env.ACTIVATION_DURATION_MS,
                storeDiscovery: process.env.STORE_DISCOVERY_DURATION_MS,
                install: process.env.INSTALL_DURATION_MS,
                cacheSave: process.env.CACHE_SAVE_DURATION_MS,
                total: process.env.TOTAL_DURATION_MS,
              })}`,
            );

      - name: Validate installed dependency
        working-directory: fixtures/${{ matrix.package-manager }}-basic
        run: node check.mjs

      - name: Remove materialized dependencies before restore
        uses: actions/github-script@v8
        env:
          FIXTURE: fixtures/${{ matrix.package-manager }}-basic
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            fs.rmSync(
              path.join(process.env.GITHUB_WORKSPACE, process.env.FIXTURE, 'node_modules'),
              { recursive: true, force: true },
            );

      - name: Restore dependency cache
        id: restore
        uses: ./
        with:
          node-version: 24.14.1
          working-directory: fixtures/${{ matrix.package-manager }}-basic
          cache-key-suffix: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}

      - name: Validate restored install and timings
        uses: actions/github-script@v8
        env:
          ACTUAL_CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CACHE_RESTORE_DURATION_MS: ${{ steps.restore.outputs.cache-restore-duration-ms }}
          SETUP_NODE_DURATION_MS: ${{ steps.restore.outputs.setup-node-duration-ms }}
          ACTIVATION_DURATION_MS: ${{ steps.restore.outputs.package-manager-activation-duration-ms }}
          STORE_DISCOVERY_DURATION_MS: ${{ steps.restore.outputs.store-discovery-duration-ms }}
          INSTALL_DURATION_MS: ${{ steps.restore.outputs.install-duration-ms }}
          CACHE_SAVE_DURATION_MS: ${{ steps.restore.outputs.cache-save-duration-ms }}
          TOTAL_DURATION_MS: ${{ steps.restore.outputs.total-duration-ms }}
        with:
          script: |
            const assert = require('assert/strict');
            assert.equal(process.env.ACTUAL_CACHE_HIT, 'true');
            core.notice(
              `restore timings (ms): ${JSON.stringify({
                cacheRestore: process.env.CACHE_RESTORE_DURATION_MS,
                setupNode: process.env.SETUP_NODE_DURATION_MS,
                activation: process.env.ACTIVATION_DURATION_MS,
                storeDiscovery: process.env.STORE_DISCOVERY_DURATION_MS,
                install: process.env.INSTALL_DURATION_MS,
                cacheSave: process.env.CACHE_SAVE_DURATION_MS,
                total: process.env.TOTAL_DURATION_MS,
              })}`,
            );

      - name: Validate restored dependency
        working-directory: fixtures/${{ matrix.package-manager }}-basic
        run: node check.mjs
