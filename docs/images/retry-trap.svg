<svg xmlns="http://www.w3.org/2000/svg" width="940" height="392" viewBox="0 0 940 392" role="img" aria-label="The retry trap: because actions/cache saves in a post step gated on job success, a failing job never populates the cache, so every retry pays the full cold install. A gate job saves the cache before anything can fail.">
  <style>
    .card   { fill: #ffffff; stroke: #d1d9e0; }
    .title  { fill: #1f2328; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sub    { fill: #59636e; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .strong { fill: #1f2328; font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .lane   { fill: #1f2328; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono   { fill: #59636e; font: 11px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .rule   { stroke: #d1d9e0; stroke-width: 1; }
    .cold   { fill: #e5534b; }
    .warm   { fill: #2da44e; }
    .work   { fill: #4493f8; }
    .gate   { fill: #8250df; font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .gateband { fill: #8250df; opacity: 0.14; }
    .chipbad  { fill: #cf222e; opacity: 0.10; }
    .chipgood { fill: #1a7f37; opacity: 0.12; }
    .bad    { fill: #cf222e; font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .good   { fill: #1a7f37; font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .card   { fill: #0d1117; stroke: #30363d; }
      .title  { fill: #e6edf3; }
      .sub    { fill: #9198a1; }
      .strong { fill: #e6edf3; }
      .lane   { fill: #e6edf3; }
      .mono   { fill: #9198a1; }
      .rule   { stroke: #30363d; }
      .cold   { fill: #f85149; }
      .warm   { fill: #3fb950; }
      .work   { fill: #388bfd; }
      .gate   { fill: #a371f7; }
      .gateband { fill: #a371f7; opacity: 0.20; }
      .chipbad  { fill: #f85149; opacity: 0.16; }
      .chipgood { fill: #3fb950; opacity: 0.16; }
      .bad    { fill: #ff7b72; }
      .good   { fill: #3fb950; }
    }
  </style>

  <rect class="card" x="0.5" y="0.5" width="939" height="391" rx="12"/>

  <!-- ===================== PANEL A ===================== -->
  <text class="title" x="24" y="30">A flaky Test job on a lockfile-changing PR</text>
  <text class="mono" x="352" y="30">actions/cache · post-if: success()</text>

  <text class="lane" x="24" y="58">attempt 1</text>
  <rect class="cold" x="150" y="46" width="113" height="16" rx="3"/>
  <rect class="work" x="264" y="46" width="169" height="16" rx="3"/>
  <text class="bad" x="443" y="58">✗</text>
  <rect class="chipbad" x="462" y="44" width="132" height="20" rx="10"/>
  <text class="bad" x="474" y="58">cache: still empty</text>
  <text class="sub" x="614" y="58">save step never runs</text>

  <text class="lane" x="24" y="88">attempt 2</text>
  <rect class="cold" x="150" y="76" width="113" height="16" rx="3"/>
  <rect class="work" x="264" y="76" width="169" height="16" rx="3"/>
  <text class="bad" x="443" y="88">✗</text>
  <rect class="chipbad" x="462" y="74" width="132" height="20" rx="10"/>
  <text class="bad" x="474" y="88">cache: still empty</text>
  <text class="sub" x="614" y="88">full install, again</text>

  <text class="lane" x="24" y="118">attempt 3</text>
  <rect class="cold" x="150" y="106" width="113" height="16" rx="3"/>
  <rect class="work" x="264" y="106" width="169" height="16" rx="3"/>
  <text class="good" x="443" y="118">✓</text>
  <rect class="chipgood" x="462" y="104" width="132" height="20" rx="10"/>
  <text class="good" x="474" y="118">cache: saved</text>
  <text class="sub" x="614" y="118">on the run that needed it least</text>

  <text class="strong" x="24" y="150">3 × cold install</text>
  <text class="sub" x="128" y="150">— the cache only lands once the job stops failing, so it never helps the failing job</text>

  <line class="rule" x1="24" y1="170" x2="916" y2="170"/>

  <!-- ===================== PANEL B ===================== -->
  <text class="title" x="24" y="198">The same flaky Test job, behind a gate job</text>
  <text class="mono" x="352" y="198">configure-nodejs · save runs inline, on a job with nothing to fail</text>

  <rect class="gateband" x="16" y="208" width="900" height="28" rx="6"/>
  <text class="gate" x="24" y="226">install-deps</text>
  <rect class="cold" x="150" y="214" width="113" height="16" rx="3"/>
  <rect class="chipgood" x="462" y="212" width="132" height="20" rx="10"/>
  <text class="good" x="474" y="226">cache: warm</text>
  <text class="sub" x="614" y="226">saved before any test runs</text>

  <text class="lane" x="24" y="258">attempt 1</text>
  <rect class="warm" x="150" y="246" width="19" height="16" rx="3"/>
  <rect class="work" x="170" y="246" width="169" height="16" rx="3"/>
  <text class="bad" x="349" y="258">✗</text>

  <text class="lane" x="24" y="288">attempt 2</text>
  <rect class="warm" x="150" y="276" width="19" height="16" rx="3"/>
  <rect class="work" x="170" y="276" width="169" height="16" rx="3"/>
  <text class="bad" x="349" y="288">✗</text>

  <text class="lane" x="24" y="318">attempt 3</text>
  <rect class="warm" x="150" y="306" width="19" height="16" rx="3"/>
  <rect class="work" x="170" y="306" width="169" height="16" rx="3"/>
  <text class="good" x="349" y="318">✓</text>

  <text class="strong" x="24" y="350">1 × cold install</text>
  <text class="sub" x="128" y="350">— every retry restores in seconds, and each attempt is a shorter feedback loop</text>

  <text class="sub" x="24" y="374">Bars are illustrative; a 60s cold install and a 10s restore are typical for a mid-size monorepo.</text>
</svg>
